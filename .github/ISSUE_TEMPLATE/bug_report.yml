name: 报告问题
description: 提供复现步骤和版本，勿上传私密讲义或登录信息。
body:
  - type: textarea
    id: versions
    attributes:
      label: 环境版本
      description: Windows、Obsidian、Codex、In-place Chat、Document Comments、PDF Annotator
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、期望与实际结果
      description: PDF 是否开启 Annotate？是否是详情页追问？请使用可公开示例。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的错误
      description: 不要上传 auth.json、data.json、完整请求记录、私密正文或令牌。
